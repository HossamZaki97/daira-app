name: daira
description: Daira mobile application, backed exclusively by Odoo 19.
publish_to: none
version: 2.0.0+1
environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 2.6.1
  intl: 0.20.2
  shared_preferences: 2.5.3
  flutter_secure_storage: 9.2.4
  app_links: 7.2.2
  share_plus: 10.1.4
  go_router: ^16.0.0
  phosphor_flutter: ^2.1.0
  package_info_plus: ^8.3.0
  url_launcher: ^6.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
